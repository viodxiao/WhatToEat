<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f2">
  <title>今天吃什么，是啊吃什么</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23285542'/%3E%3Cpath d='M24 8c-10 0-16 4-16 10a5 5 0 0 0 5 5c6 0 11-6 11-15ZM7 25l11-11' fill='none' stroke='white' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/styles.css">
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/assets/natural-language.js"></script>
</head>
<body>
  <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 4c-9 0-15 4-15 10a5 5 0 0 0 5 5c6 0 10-6 10-15Z M4 21l10-10"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M6 6l2.5 2.5m7 7L18 18M6 18l2.5-2.5m7-7L18 6"/></symbol>
    <symbol id="i-basket" viewBox="0 0 24 24"><path d="M3 10h18l-2 9H5l-2-9Zm4 0 4-6m6 6-4-6m-4 9 .5 3m5.5-3-.5 3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6v14m0-14c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 10a7.5 7.5 0 1 0 0 5m0-5V5m0 5h-5"/></symbol>
  </svg>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark"><svg class="icon"><use href="#i-leaf"/></svg></span>
      <span>是啊吃什么</span>
    </a>
    <a class="plan-link" href="#plan"><svg class="icon"><use href="#i-basket"/></svg> 我的菜单 <span id="nav-count">0</span></a>
  </header>
  <main class="layout">
    <section class="hero" id="hero" aria-labelledby="headline">
      <div class="hero-grain"></div>
      <div id="float-layer" class="float-layer" aria-hidden="true"></div>
      <div class="hero-content">
        <h1 id="headline">今天吃什么？</h1>
        <p>从手边食材出发，找到今天想做的菜。</p>
        <button class="random-button" id="random" type="button" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-spark"/></svg>
          <span>选择困难？我来替你选择！</span>
        </button>
      </div>
      <svg id="connections" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="thread-light">
            <stop stop-color="#76aa90"/>
            <stop offset=".5" stop-color="#b8b7e5"/>
            <stop offset="1" stop-color="#84ae98"/>
          </linearGradient>
        </defs>
        <g id="threads"></g>
      </svg>
      <div id="draw-layer" class="draw-layer" aria-hidden="true"></div>
      <div id="flash" class="flash" aria-hidden="true"></div>
    </section>

    <div class="workspace">
      <div class="main-column">
        <section class="panel" aria-labelledby="nl-title">
          <header class="panel-head">
            <div class="panel-heading"><span class="panel-icon"><svg class="icon"><use href="#i-spark"/></svg></span><h2 id="nl-title">描述你想做的菜</h2></div>
            <span class="secondary nl-head-hint">一句话说明食材和条件</span>
          </header>
          <form class="nl-body" id="nl-form">
            <label class="nl-label" for="nl-text">已有食材、缺少的佐料或厨具，以及难度要求</label>
            <textarea class="nl-input" id="nl-text" name="text" required maxlength="2000" rows="3" placeholder="我有番茄和鸡蛋，没有生抽，想做简单一点的"></textarea>
            <div class="nl-actions">
              <label class="nl-toggle"><input type="checkbox" name="ontology" checked> 使用菜谱本体辅助理解</label>
              <button class="solid-button nl-submit" type="submit">搜索菜谱</button>
            </div>
            <div class="nl-output" id="nl-output" role="status" aria-live="polite"></div>
          </form>
        </section>
        <section class="panel pantry" aria-labelledby="pantry-title">
          <header class="panel-head">
            <div class="panel-heading"><span class="panel-icon"><svg class="icon"><use href="#i-leaf"/></svg></span><h2 id="pantry-title">我的厨房</h2></div>
            <button id="clear" class="subtle" type="button" hidden>重置筛选</button>
          </header>
          <div class="selected-line" id="selections" aria-label="已选标签"></div>
          <p class="pantry-hint"><strong>食材</strong>标记你手头有的；<strong>佐料和厨具只标记你缺的</strong>，没标记的一律按齐备处理。</p>
          <div class="filters" id="filters"></div>
          <div class="filter-row difficulty-row">
            <div class="filter-caption"><h3>难度</h3><span>可多选</span></div>
            <div id="difficulty" class="filter-tags" aria-label="菜谱难度"></div>
          </div>
          <div class="filter-row category-row">
            <div class="filter-caption"><h3>菜谱分类</h3><span>可多选</span></div>
            <div id="categories" class="filter-tags" aria-label="菜谱分类"></div>
          </div>
        </section>

        <section class="panel results" aria-labelledby="results-title">
          <header class="panel-head">
            <div class="panel-heading"><span class="panel-icon"><svg class="icon"><use href="#i-book"/></svg></span><h2 id="results-title">菜谱</h2></div>
            <div class="result-actions">
              <span class="secondary" id="result-count" role="status"></span>
              <button class="chip refresh-recipes" id="refresh-recipes" type="button" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
                换一批
              </button>
            </div>
          </header>
          <div class="recipe-search">
            <label class="filter-input-wrap">
              <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
              <input class="filter-input" id="recipe-search" type="search" placeholder="搜索菜谱名称" aria-label="搜索菜谱名称" maxlength="100" disabled>
            </label>
          </div>
          <div id="results"></div>
        </section>
      </div>

      <aside class="panel plan" id="plan" aria-labelledby="plan-title">
        <header class="panel-head">
          <div class="panel-heading"><span class="panel-icon"><svg class="icon"><use href="#i-basket"/></svg></span><h2 id="plan-title">我的菜单</h2></div>
          <span class="count-badge" id="plan-count">0 道</span>
        </header>
        <div class="plan-section">
          <div class="shopping-heading">
            <h3>所需材料</h3>
            <button class="chip copy-missing" id="copy-missing" type="button" disabled>复制缺料清单</button>
          </div>
          <div id="shopping"></div>
          <div class="copy-fallback" id="copy-fallback" hidden>
            <label for="missing-text">选中文本后复制</label>
            <textarea id="missing-text" rows="5" readonly></textarea>
          </div>
        </div>
        <div class="plan-section basket-section">
          <h3>已选菜谱</h3>
          <div id="basket"></div>
        </div>
      </aside>
    </div>
  </main>

  <dialog class="detail" id="detail" aria-labelledby="detail-title">
    <div class="dialog-inner">
      <button class="icon-button dialog-close" type="button" aria-label="关闭详情" autofocus>×</button>
      <div id="detail-content"></div>
      <footer class="detail-footer"><button class="solid-button" id="detail-add" type="button"></button></footer>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
